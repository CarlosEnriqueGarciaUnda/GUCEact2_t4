<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Formulario</title></head>
<body>
    <h2>Agregar Materia (@ModelAttribute)</h2>
    <form th:action="@{/vistas/guardar}" th:object="${materia}" method="post">
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required /><br/>
        
        <label>Categoría:</label>
        <input type="text" th:field="*{categoria}" required /><br/>
        
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
