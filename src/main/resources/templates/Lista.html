<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Lista de Materias</title></head>
<body>
    <h1 th:text="${autor}">Autor del proyecto</h1>
    <h2>Materias:</h2>
    <ul>
        <!-- Uso de th:each -->
        <li th:each="materia : ${materias}">
            ID: <span th:text="${materia.id}"></span> - 
            Nombre: <span th:text="${materia.nombre}"></span> 
            (<span th:text="${materia.categoria}"></span>)
            <a th:href="@{/vistas/detalle/{id}(id=${materia.id})}">Ver detalle (PathVariable)</a>
        </li>
    </ul>
    <a href="/vistas/formulario">Agregar nueva materia</a>
    <br><br>
    <a href="/vistas/buscar?cat=Programacion">Probar RequestParam (?cat=Programacion)</a>
</body>
</html>
